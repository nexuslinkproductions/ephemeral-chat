<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>gate fixture pair</title>
<body>
<p id="role">fixture</p>
<script>
/* Minimal two peer fixture. The gate drives it over CDP; no app code here. */
(function () {
  'use strict';
  var role = new URLSearchParams(location.search).get('role') || 'a';
  var pc = null;
  var dc = null;
  var fx = {
    role: role,
    make: function () {
      pc = new RTCPeerConnection();
      if (role === 'a') {
        dc = pc.createDataChannel('chat', { ordered: true });
      }
      pc.ondatachannel = function (e) { dc = e.channel; };
      return true;
    },
    gather: function () {
      return new Promise(function (resolve) {
        if (pc.iceGatheringState === 'complete') { resolve(true); return; }
        var done = false;
        var timer = setTimeout(function () { if (!done) { done = true; resolve(false); } }, 3000);
        pc.addEventListener('icegatheringstatechange', function () {
          if (pc.iceGatheringState === 'complete' && !done) {
            done = true;
            clearTimeout(timer);
            resolve(true);
          }
        });
      });
    },
    offer: async function () {
      var o = await pc.createOffer();
      await pc.setLocalDescription(o);
      await fx.gather();
      return pc.localDescription.sdp;
    },
    accept: async function (sdp) {
      await pc.setRemoteDescription({ type: 'offer', sdp: sdp });
      var a = await pc.createAnswer();
      await pc.setLocalDescription(a);
      await fx.gather();
      return pc.localDescription.sdp;
    },
    finish: async function (sdp) {
      await pc.setRemoteDescription({ type: 'answer', sdp: sdp });
      return true;
    },
    send: function (text) {
      if (!dc || dc.readyState !== 'open') { return false; }
      dc.send(text);
      return true;
    },
    state: function () {
      return { role: role, dc: dc ? dc.readyState : 'none', pc: pc ? pc.connectionState : 'none' };
    }
  };
  window.__fx = fx;
  document.getElementById('role').textContent = 'fixture ' + role;
})();
</script>
</body>
</html>
